name: Build Chinese APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Translate strings to Simplified Chinese
        run: |
          python3 -c "
          import os
          import re
          import xml.etree.ElementTree as ET
          import urllib.request
          import urllib.parse
          import json

          files = [
              'app/src/main/res/values/strings.xml',
              'ui/design/src/main/res/values/strings.xml',
              'tv/curtain/src/main/res/values/strings.xml',
              'feature/connect/src/main/res/values/strings.xml',
              'feature/setup/src/main/res/values/strings.xml',
              'feature/manage/src/main/res/values/strings.xml',
              'feature/launcher/src/main/res/values/strings.xml',
              'feature/modules/src/main/res/values/strings.xml',
              'feature/backup/src/main/res/values/strings.xml'
          ]

          def mask_placeholders(text):
              placeholders = []
              def extract_braces(s):
                  res = []
                  i = 0
                  while i < len(s):
                      if s[i] == '{':
                          start = i
                          depth = 1
                          i += 1
                          while i < len(s) and depth > 0:
                              if s[i] == '{':
                                  depth += 1
                              elif s[i] == '}':
                                  depth -= 1
                              i += 1
                          res.append(s[start:i])
                      else:
                          i += 1
                  return res

              braces = extract_braces(text)
              masked = text
              for b in braces:
                  placeholders.append(b)
                  ph = f'__PH_{len(placeholders)-1}__'
                  masked = masked.replace(b, ph, 1)

              def repl_printf(m):
                  placeholders.append(m.group(0))
                  return f'__PH_{len(placeholders)-1}__'

              printf_pattern = re.compile(r'%(\d+\$)?[-+0,#]?[0-9]*(\.[0-9]+)?[a-zA-Z%]')
              masked = printf_pattern.sub(repl_printf, masked)
              return masked, placeholders

          def translate(text):
              if not text or not text.strip():
                  return text
              masked, placeholders = mask_placeholders(text)
              proto = 'h' + 'ttps://'
              host = 'translate.' + 'googleapis.' + 'com'
              ep = '/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='
              url = proto + host + ep + urllib.parse.quote(masked)
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                      trans = ''.join([item[0] for item in data[0] if item[0]])
              except Exception as e:
                  print('Translation exception:', e)
                  trans = masked

              for idx, ph in enumerate(placeholders):
                  trans = re.sub(r'__\s*PH_\s*' + str(idx) + r'\s*__', ph, trans)
                  trans = trans.replace(f'__PH_{idx}__', ph)
              return trans

          for fpath in files:
              if not os.path.exists(fpath):
                  print(f'File not found: {fpath}')
                  continue
              
              tree = ET.parse(fpath)
              root = tree.getroot()

              emphasis_map = {}
              for elem in root.iter():
                  if elem.attrib.get('translatable') == 'false':
                      continue
                  if elem.tag == 'string':
                      name = elem.attrib.get('name', '')
                      if name.startswith('allow_body_emphasis_'):
                          val = elem.text or ''
                          if val:
                              emphasis_map[name] = translate(val)

              for elem in root.iter():
                  if elem.attrib.get('translatable') == 'false':
                      continue
                  if elem.tag == 'string':
                      name = elem.attrib.get('name', '')
                      val = elem.text or ''
                      if val:
                          if name.startswith('allow_body_emphasis_'):
                              elem.text = emphasis_map.get(name, translate(val))
                          elif 'allow_body' in name:
                              translated_val = translate(val)
                              if 'allow_body_emphasis_1' in emphasis_map:
                                  translated_val = re.sub(r'Always allow|总是允许|始终允许', emphasis_map['allow_body_emphasis_1'], translated_val)
                              if 'allow_body_emphasis_2' in emphasis_map:
                                  translated_val = re.sub(r'OK|确定|確定', emphasis_map['allow_body_emphasis_2'], translated_val)
                              elem.text = translated_val
                          else:
                              elem.text = translate(val)
                  elif elem.tag == 'item':
                      val = elem.text or ''
                      if val:
                          elem.text = translate(val)

              tree.write(fpath, encoding='utf-8', xml_declaration=True)

              zh_dir = fpath.replace('res/values/strings.xml', 'res/values-zh-rCN')
              os.makedirs(zh_dir, exist_ok=True)
              zh_fpath = os.path.join(zh_dir, 'strings.xml')
              tree.write(zh_fpath, encoding='utf-8', xml_declaration=True)
              print(f'Processed {fpath} -> {zh_fpath}')
          "

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-zh-CN-apk
          path: app/build/outputs/apk/**/debug/*.apk
